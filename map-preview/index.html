<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colorful Map Preview | Where in the World</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f5faf9;color:#17334a}header{background:#142b49;color:white;padding:20px max(18px,4vw)}h1{font-size:clamp(1.4rem,3vw,2.1rem);margin:0 0 5px}header p{margin:0;color:#c8e5e6}.wrap{max-width:1300px;margin:18px auto;padding:0 16px}.notice{padding:12px 16px;background:white;border:1px solid #d5e3e4;border-radius:12px;margin-bottom:12px}a{color:#0b6d79}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:15px}#map{height:min(75vh,740px);min-height:440px;border-radius:17px;border:1px solid #bfd5da;background:#c8f0fa;overflow:hidden}#results{background:white;border:1px solid #d5e3e4;border-radius:15px;padding:16px;max-height:740px;overflow:auto}#results h2{font-size:1.25rem;margin:0 0 12px}.song{padding:10px 0;border-bottom:1px solid #e0e8e8}.song strong{display:block}.song small{color:#4e6672}.music-pin{background:#f4c54e;border:3px solid #184b68;border-radius:50%;text-align:center;font-weight:900;line-height:30px;box-shadow:0 3px 7px #14374c44}.music-pin span{display:block}.leaflet-container{background:#c8f0fa}.leaflet-control-attribution{font-size:10px}.country-shape{pointer-events:none}.status{font-size:.92rem;color:#426373}@media(max-width:850px){.layout{grid-template-columns:1fr}#map{height:55vh;min-height:370px}#results{max-height:none}}
</style></head><body><header><h1>♫ Colorful World Map — Preview</h1><p>Testing only · The main music website is unchanged</p></header><main class="wrap"><div class="notice"><a href="../">← Back to the regular website</a> · <span id="status" class="status">Loading country boundaries and songs…</span></div><div class="layout"><div id="map" aria-label="Interactive colorful political world map"></div><aside id="results"><h2>Explore the map</h2><p>Tap a yellow music marker to see its songs.</p></aside></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3/dist/d3-geo.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const status=document.getElementById('status'),results=document.getElementById('results');
const map=L.map('map',{scrollWheelZoom:false,zoomSnap:.25,minZoom:1,maxZoom:8,maxBounds:[[-75,-180],[85,180]],maxBoundsViscosity:1,preferCanvas:false});
map.fitBounds([[-55,-180],[80,180]],{padding:[12,12]});
const colors=['#e9988a','#86c3a1','#e9c76d','#8baed0','#b9a2d8','#68b5b1','#d7a6ba','#b6d187','#e6aa76','#83b4c7','#e1d58e','#a2b8e0'];
const coords={TK:[-9.2,-171.8],BD:[24,90],AU:[-25,134],PK:[30,69],NP:[28,84],NI:[13,-85],VE:[7,-66],JM:[18,-77],SV:[13.7,-89],DE:[51,10],KH:[12.5,105],PH:[12,122],SY:[35,38],KE:[.2,38],GL:[72,-42],CL:[-33,-71],NZ:[-41,174],SN:[14,-14],IL:[31.5,35],ZA:[-29,24],CO:[4,-74],SO:[6,46],BY:[53,28],GB:[53,-2],RU:[61,95],IN:[21,79],CU:[21.5,-79.5],JP:[36,138],ET:[9,40],IE:[53,-8],PS:[31.8,35.2],FR:[46.5,2.5],CM:[5.8,12],BR:[-11,-52],CA:[57,-105],NO:[61,9],EG:[26,30],LA:[18,103],TH:[15,101],VN:[16,107],CN:[35,104],MM:[21,96],US:[39,-98]};
function showSongs(code,items){results.replaceChildren();let h=document.createElement('h2');h.textContent=items[0]?.country||code;results.append(h);for(const s of items){let div=document.createElement('div');div.className='song';let strong=document.createElement('strong');strong.textContent=s.title;let small=document.createElement('small');small.textContent=s.artist||'';div.append(strong,small);results.append(div)}}
function addMarkers(songs){const grouped={};for(const s of songs){for(const c of s.countries?.length?s.countries:[s.countryCode]){if(c)(grouped[c]??=[]).push(s)}}for(const [code,items] of Object.entries(grouped)){if(!coords[code])continue;const count=new Set(items.map(s=>s.id)).size;const icon=L.divIcon({className:'music-pin',html:'<span>'+count+'</span>',iconSize:[36,36],iconAnchor:[18,18]});L.marker(coords[code],{icon}).addTo(map).bindTooltip((items[0]?.country||code)+' · '+count+' performances').on('click',()=>showSongs(code,items))}}
function addCountries(world){if(!window.d3||!window.topojson)throw Error('Map rendering libraries did not load');const features=topojson.feature(world,world.objects.countries).features.filter(f=>f.properties?.name!=='Antarctica');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.style.cssText='position:absolute;left:0;top:0;z-index:450;pointer-events:none;overflow:hidden';map.getContainer().appendChild(svg);const paths=features.map(f=>{let p=document.createElementNS('http://www.w3.org/2000/svg','path');let n=f.properties?.name||String(f.id||'');let hash=0;for(let i=0;i<n.length;i++)hash=(hash*31+n.charCodeAt(i))>>>0;p.setAttribute('fill',colors[hash%colors.length]);p.setAttribute('stroke','#f7faf6');p.setAttribute('stroke-width','.8');p.setAttribute('stroke-linejoin','round');svg.appendChild(p);return p});function draw(){const size=map.getSize(),origin=map.getPixelOrigin(),worldPx=256*Math.pow(2,map.getZoom());svg.setAttribute('width',size.x);svg.setAttribute('height',size.y);svg.setAttribute('viewBox','0 0 '+size.x+' '+size.y);const projection=d3.geoMercator().scale(worldPx/(2*Math.PI)).translate([worldPx/2-origin.x,worldPx/2-origin.y]).clipExtent([[0,0],[size.x,size.y]]);const path=d3.geoPath(projection);features.forEach((f,i)=>paths[i].setAttribute('d',path(f)||''))}draw();map.on('moveend zoomend resize',draw);status.textContent='Colorful country map loaded. Zoom and tap markers to test.'}
Promise.all([fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>{if(!r.ok)throw Error('Country map HTTP '+r.status);return r.json()}),fetch('../songs.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Songs HTTP '+r.status);return r.json()})]).then(([world,songs])=>{addCountries(world);addMarkers(songs)}).catch(e=>{console.error(e);status.textContent='Preview loading error: '+e.message;results.textContent='The preview did not load correctly. The main site is unaffected.'});
</script></body></html>
